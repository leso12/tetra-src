name: Navigation configuration checks
on:
  pull_request:
    paths:
      - 'tetraDS_2dnav/launch/**'
      - 'tetraDS_2dnav/config/**'
      - 'tetraDS_2dnav/odom_nav_config/**'
      - 'tests/test_navigation*.py'
      - '.github/workflows/navigation-config-checks.yml'
  push:
    branches: [main]
    paths:
      - 'tetraDS_2dnav/launch/**'
      - 'tetraDS_2dnav/config/**'
      - 'tetraDS_2dnav/odom_nav_config/**'
      - 'tests/test_navigation*.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python -m unittest discover -s tests -p 'test_navigation*.py' -v
